<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- typebud shared held book, hugged closed with the cover facing out. Drawn around (0,0); move/tilt with
       the group transform. Hug anchor = translate(164 140), tilt -8deg. -->
  <g transform="translate(147 138) rotate(6)">
    <!-- page block (top + right edge, 3/4 thickness) -->
    <path d="M-17 -21 L-12 -25 L21 -25 L21 19 L16 23 Z" fill="#FFF8EE" stroke="#3B2A1E" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M-10 -22.5 L18 -22.5 M18 -21 L18 17" stroke="#E2D3BE" stroke-width="2" stroke-linecap="round"/>
    <!-- cover -->
    <rect x="-19" y="-21" width="35" height="44" rx="3.5" fill="#8DBBA9" stroke="#3B2A1E" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M-19 -18 L-19 20 Q-19 23 -16 23 L-12 23 L-12 -21 L-16 -21 Q-19 -21 -19 -18 Z" fill="#6E9E8B"/>
    <path d="M-12 -21 L-12 23" stroke="#3B2A1E" stroke-width="3" stroke-linecap="round"/>
    <!-- label + tiny heart -->
    <rect x="-6" y="-12" width="17" height="11" rx="2" fill="#FFF8EE" stroke="#3B2A1E" stroke-width="2.5"/>
    <path d="M2.5 9 C-2 5 -2 1.5 0.5 1.5 C1.8 1.5 2.5 2.5 2.5 3.3 C2.5 2.5 3.2 1.5 4.5 1.5 C7 1.5 7 5 2.5 9 Z" fill="#F4A6A0" stroke="#3B2A1E" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
