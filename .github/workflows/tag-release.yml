name: Tag release

# Bumping `.version` in build.zig.zon on main is all a release takes: this pushes the
# matching v<version> tag, and the tag push starts release.yml as usual.
#
# The tag is pushed with secret TYPEBUD_RELEASE_TOKEN, a fine-grained personal access
# token for this repository with "Contents" and "Workflows" set to read and write.
# The built-in GITHUB_TOKEN can't do this job: GitHub refuses it a tag on a commit that
# contains workflow files, and tags it does push never start other workflows.
# See docs/RELEASING.md.

on:
  push:
    branches: [main]
    paths: [build.zig.zon]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag v<version> from build.zig.zon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TYPEBUD_RELEASE_TOKEN || github.token }}
      - name: Push the tag
        env:
          HAS_TOKEN: ${{ secrets.TYPEBUD_RELEASE_TOKEN != '' }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon | head -n1)"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::build.zig.zon version '$version' is not a semantic version"; exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to release."; exit 0
          fi
          if [[ "$HAS_TOKEN" != "true" ]]; then
            echo "::error::secret TYPEBUD_RELEASE_TOKEN is not set, so $tag can't be tagged automatically (see docs/RELEASING.md). Push it by hand: git tag -a $tag -m 'typebud $version' $GITHUB_SHA && git push origin $tag"
            exit 1
          fi
          git config user.name plyght
          git config user.email plyght@peril.lol
          git tag -a "$tag" -m "typebud $version" "$GITHUB_SHA"
          git push origin "$tag"
          echo "::notice::Pushed $tag; release.yml is building it."
