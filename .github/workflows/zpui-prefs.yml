name: zpui prefs-demo screenshots

# Renders zpui's preferences demo (examples/prefs_demo.zig: every native-control kind
# plus the "only show in these apps" list) in each desktop look and uploads the PNGs:
# GNOME / libadwaita and KDE / Breeze (zpui-drawn controls, Vulkan lavapipe under Xvfb)
# in light and dark, and macOS (real AppKit controls, Metal) in light and dark.

on:
  push:
    paths:
      - .github/workflows/zpui-prefs.yml
  workflow_dispatch:
    inputs:
      zpui_ref:
        description: plyght/zpui branch, tag or commit to render
        default: main

env:
  ZPUI_REF: ${{ inputs.zpui_ref || 'main' }}
  # Same headless Linux setup as zpui's ci.yml, plus Xvfb + ImageMagick for the capture.
  LINUX_DEPS: >-
    libvulkan-dev mesa-vulkan-drivers glslc
    libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev
    libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcursor-dev libxi-dev libxrandr-dev
    libfreetype-dev libharfbuzz-dev libfontconfig-dev fonts-inter fonts-jetbrains-mono fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
    xvfb imagemagick

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: plyght/zpui
          ref: ${{ env.ZPUI_REF }}
          path: zpui
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
      - name: Build prefs-demo
        working-directory: zpui
        run: zig build install --summary all
      - name: Render GNOME / KDE × light / dark (Xvfb)
        working-directory: zpui
        timeout-minutes: 10
        run: |
          Xvfb :99 -screen 0 1400x1200x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          sleep 2
          for style in gnome kde; do
            for appearance in light dark; do
              ZPUI_DESKTOP_STYLE=$style ZPUI_PREFS_APPEARANCE=$appearance ZPUI_SMOKE_FRAMES=20 \
                ZPUI_SMOKE_OUT=zig-out/prefs-demo-$style-$appearance.png ./zig-out/bin/prefs-demo
            done
            # The drop-down list open.
            ZPUI_DESKTOP_STYLE=$style ZPUI_PREFS_OPEN=popup ZPUI_SMOKE_FRAMES=20 \
              ZPUI_SMOKE_OUT=zig-out/prefs-demo-$style-popup.png ./zig-out/bin/prefs-demo
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zpui-prefs-linux
          path: zpui/zig-out/prefs-demo-*.png
          if-no-files-found: warn

  macos:
    # Intel: Apple Silicon runners expose no Metal device. macOS 26 for Liquid Glass controls.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: plyght/zpui
          ref: ${{ env.ZPUI_REF }}
          path: zpui
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build prefs-demo
        working-directory: zpui
        run: zig build install --summary all
      - name: Render light / dark
        working-directory: zpui
        timeout-minutes: 10
        run: |
          for appearance in light dark; do
            ZPUI_PREFS_APPEARANCE=$appearance ZPUI_SMOKE_FRAMES=30 \
              ZPUI_SMOKE_OUT=zig-out/prefs-demo-${{ matrix.os }}-$appearance.png ./zig-out/bin/prefs-demo
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zpui-prefs-${{ matrix.os }}
          path: zpui/zig-out/prefs-demo-*.png
          if-no-files-found: warn
